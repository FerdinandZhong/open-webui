---
# Configuration file for CML jobs
# Contains all job definitions and their parameters

jobs:
  # Git sync job - runs first (no parent)
  # Keeps repository in sync with remote changes
  # This job runs immediately after project creation (git repository is already cloned by CML)
  # NOTE: Uses RELATIVE path (CML expects relative paths, not absolute /home/cdsw/ paths)
  git_sync:
    name: "Git Repository Sync"
    script: ".git_sync.py"
    arguments: ""
    kernel: "python3"
    runtime_id: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-standard:2025.09.1-b5"
    cpu: 4
    memory: 16
    gpu: 0
    timeout: 300
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"  # Will be replaced at runtime

  # Environment setup job - runs after git sync completes
  # Creates Python virtual environment and installs dependencies
  # NOTE: Uses RELATIVE path (CML expects relative paths, not absolute /home/cdsw/ paths)
  create_env:
    name: Create Python Environment
    script: cai_integration/setup_environment.py
    kernel: python3
    runtime_id: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-standard:2025.09.1-b5"
    cpu: 4
    memory: 16
    timeout: 1800  # 30 minutes
    parent_job_key: "git_sync"
    environment: {}
    arguments: ""

  # Frontend build job - runs after environment setup completes
  # Builds the frontend assets for Open-WebUI
  # NOTE: Uses RELATIVE path (CML expects relative paths, not absolute /home/cdsw/ paths)
  build_frontend:
    name: "Build Frontend"
    script: "cai_integration/build_frontend.py"
    kernel: "python3"
    runtime_id: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-standard:2025.09.1-b5"
    cpu: 4
    memory: 16
    timeout: 1800  # 30 minutes
    parent_job_key: "create_env"
    arguments: ""
    environment: {}


